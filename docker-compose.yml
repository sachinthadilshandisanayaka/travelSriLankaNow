version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: travel-srilanka-db
    environment:
      POSTGRES_DB: travel_srilanka_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-network

  # Spring Boot Backend
  backend:
    build:
      context: ./traveSriLankaNowBE
      dockerfile: Dockerfile
    container_name: travel-srilanka-backend
    environment:
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/travel_srilanka_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET}
      # Cloudinary Configuration
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Admin User Configuration
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@travelsrilankanow.com}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/locations"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - travel-network

  # Angular Frontend (Nginx)
  frontend:
    build:
      context: ./travelSrilankaNow
      dockerfile: Dockerfile
    container_name: travel-srilanka-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - travel-network

volumes:
  postgres_data:
    driver: local

networks:
  travel-network:
    driver: bridge
