version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: travel-srilanka-db
    environment:
      POSTGRES_DB: travel_srilanka_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-network

  # Spring Boot Backend
  backend:
    build:
      context: ./traveSriLankaNowBE
      dockerfile: Dockerfile
    container_name: travel-srilanka-backend
    environment:
      # Database Configuration (Spring Boot relaxed binding)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/travel_srilanka_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # JWT Configuration (override for production)
      JWT_SECRET: ${JWT_SECRET:-dGhpc2lzYXZlcnlzZWN1cmVzZWNyZXRrZXlmb3J0cmF2ZWxzcmlsYW5rYW5vd2FwcGxpY2F0aW9uMjAyNA==}
      # Cloudinary Configuration (use environment variables in production)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dqsmid3tg}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-384683498784571}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-wGfR4-xbGHnLoY4ybUaVYs4RFII}
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/locations"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - travel-network

  # Angular Frontend
  frontend:
    build:
      context: ./travelSrilankaNow
      dockerfile: Dockerfile
    container_name: travel-srilanka-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - travel-network

volumes:
  postgres_data:
    driver: local

networks:
  travel-network:
    driver: bridge
