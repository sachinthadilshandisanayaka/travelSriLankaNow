<div class="drp-wrap">

  <!-- Trigger -->
  <button type="button" class="drp-trigger"
          [class.drp-trigger--has-value]="tempStart || startDate"
          [class.drp-trigger--open]="isOpen"
          (click)="toggleOpen($event)">
    <svg class="drp-trigger__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="16" y1="2" x2="16" y2="6"></line>
      <line x1="8" y1="2" x2="8" y2="6"></line>
      <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
    <span class="drp-trigger__label">{{ displayLabel }}</span>
    <svg class="drp-trigger__chevron" [class.drp-trigger__chevron--open]="isOpen"
         width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  <!-- Panel -->
  <div class="drp-panel" *ngIf="isOpen" (click)="$event.stopPropagation()">

    <!-- Selection phase indicator -->
    <div class="drp-phase-hint" *ngIf="mode === 'range'">
      <span class="drp-phase-dot" [class.drp-phase-dot--active]="!selectingEnd"></span>
      <span [class.drp-phase-label--active]="!selectingEnd">Check-in</span>
      <span class="drp-phase-arrow">→</span>
      <span class="drp-phase-dot" [class.drp-phase-dot--active]="selectingEnd"></span>
      <span [class.drp-phase-label--active]="selectingEnd">Check-out</span>
    </div>

    <div class="drp-calendars">

      <!-- Left Calendar -->
      <div class="drp-calendar">
        <div class="drp-cal-nav">
          <button type="button" class="drp-cal-nav__btn" (click)="prevMonth($event)" title="Previous month">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <span class="drp-cal-nav__title">{{ MONTHS[leftMonth] }} {{ leftYear }}</span>
          <div class="drp-cal-nav__spacer"></div>
        </div>

        <div class="drp-cal-grid" (mouseleave)="clearHover()">
          <div class="drp-cal-weekday" *ngFor="let wd of WEEKDAYS">{{ wd }}</div>
          <div *ngFor="let day of leftDays; trackBy: trackByDate"
               class="drp-cal-day"
               [class.drp-cal-day--other]="!day.currentMonth"
               [class.drp-cal-day--today]="day.isToday && day.currentMonth"
               [class.drp-cal-day--start]="day.isStart && day.currentMonth"
               [class.drp-cal-day--end]="day.isEnd && day.currentMonth"
               [class.drp-cal-day--range]="day.inRange && day.currentMonth"
               [class.drp-cal-day--disabled]="day.isDisabled"
               [class.drp-cal-day--hover]="day.isHover && day.currentMonth"
               (click)="onDayClick($event, day)"
               (mouseenter)="onDayHover(day.date)">
            <span *ngIf="day.currentMonth">{{ day.day }}</span>
          </div>
        </div>
      </div>

      <div class="drp-divider"></div>

      <!-- Right Calendar -->
      <div class="drp-calendar">
        <div class="drp-cal-nav">
          <div class="drp-cal-nav__spacer"></div>
          <span class="drp-cal-nav__title">{{ MONTHS[rightMonth] }} {{ rightYear }}</span>
          <button type="button" class="drp-cal-nav__btn" (click)="nextMonth($event)" title="Next month">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>

        <div class="drp-cal-grid" (mouseleave)="clearHover()">
          <div class="drp-cal-weekday" *ngFor="let wd of WEEKDAYS">{{ wd }}</div>
          <div *ngFor="let day of rightDays; trackBy: trackByDate"
               class="drp-cal-day"
               [class.drp-cal-day--other]="!day.currentMonth"
               [class.drp-cal-day--today]="day.isToday && day.currentMonth"
               [class.drp-cal-day--start]="day.isStart && day.currentMonth"
               [class.drp-cal-day--end]="day.isEnd && day.currentMonth"
               [class.drp-cal-day--range]="day.inRange && day.currentMonth"
               [class.drp-cal-day--disabled]="day.isDisabled"
               [class.drp-cal-day--hover]="day.isHover && day.currentMonth"
               (click)="onDayClick($event, day)"
               (mouseenter)="onDayHover(day.date)">
            <span *ngIf="day.currentMonth">{{ day.day }}</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="drp-footer">
      <div class="drp-footer__hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>{{ selectionHint }}</span>
      </div>
      <div class="drp-footer__actions">
        <button type="button" class="drp-btn-cancel" (click)="onCancel($event)">Cancel</button>
        <button type="button" class="drp-btn-apply" (click)="onApply($event)"
                [disabled]="!tempStart || (mode === 'range' && !tempEnd)">Apply</button>
      </div>
    </div>

  </div>
</div>
