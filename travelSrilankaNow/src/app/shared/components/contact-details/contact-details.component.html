<div class="contact-details" *ngIf="!loading && contacts.length > 0">
  <h3 class="contact-details__title">Contact</h3>
  <div class="contact-details__list">
    <ng-container *ngFor="let contact of contacts">

      <!-- WeChat: no URL, just show ID to copy -->
      <div *ngIf="isWeChat(contact.contactType)"
           class="contact-btn contact-btn--wechat"
           [style.--contact-color]="getMeta(contact.contactType).color"
           title="{{ contact.value }}">
        <span class="contact-btn__icon">
          <ng-container [ngTemplateOutlet]="iconTpl" [ngTemplateOutletContext]="{ type: contact.contactType }"></ng-container>
        </span>
        <span class="contact-btn__label">{{ getDisplayLabel(contact) }}: {{ contact.value }}</span>
      </div>

      <!-- All other types: clickable link -->
      <a *ngIf="!isWeChat(contact.contactType)"
         class="contact-btn"
         [style.--contact-color]="getMeta(contact.contactType).color"
         [href]="getUrl(contact)"
         [target]="isOpenInNew(contact.contactType) ? '_blank' : '_self'"
         [rel]="isOpenInNew(contact.contactType) ? 'noopener noreferrer' : ''"
         [title]="contact.value">
        <span class="contact-btn__icon">
          <ng-container [ngTemplateOutlet]="iconTpl" [ngTemplateOutletContext]="{ type: contact.contactType }"></ng-container>
        </span>
        <span class="contact-btn__label">{{ getDisplayLabel(contact) }}</span>
      </a>

    </ng-container>
  </div>
</div>
