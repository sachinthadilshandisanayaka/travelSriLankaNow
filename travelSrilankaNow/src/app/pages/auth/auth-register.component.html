<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <h2>{{ siteName }}</h2>
    </div>
    <h3 class="auth-card__title">Create Account</h3>
    <p class="auth-card__subtitle">Join us and start booking adventures</p>

    <div class="auth-error-toast" *ngIf="error">
      <span class="auth-error-toast__icon">⚠</span>
      <span class="auth-error-toast__msg">{{ error }}</span>
      <button class="auth-error-toast__close" type="button" (click)="error = ''">✕</button>
    </div>

    <form (ngSubmit)="register()" class="auth-form">
      <div class="auth-form__row">
        <div class="auth-form__group">
          <label>First Name</label>
          <input type="text" [(ngModel)]="firstName" name="firstName" placeholder="First name">
        </div>
        <div class="auth-form__group">
          <label>Last Name</label>
          <input type="text" [(ngModel)]="lastName" name="lastName" placeholder="Last name">
        </div>
      </div>
      <div class="auth-form__group">
        <label>Username *</label>
        <input type="text" [(ngModel)]="username" name="username" placeholder="Choose a username" autocomplete="username">
      </div>
      <div class="auth-form__group">
        <label>Email *</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="auth-form__group">
        <label>Phone Number</label>
        <input type="tel" [(ngModel)]="phoneNumber" name="phoneNumber" placeholder="+94 77 000 0000">
      </div>
      <div class="auth-form__row">
        <div class="auth-form__group">
          <label>Password *</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="Min 6 characters" autocomplete="new-password">
        </div>
        <div class="auth-form__group">
          <label>Confirm Password *</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repeat password" autocomplete="new-password">
        </div>
      </div>
      <button type="submit" class="auth-btn" [disabled]="loading">
        <span *ngIf="!loading">Create Account</span>
        <span *ngIf="loading" class="auth-btn__spinner"></span>
      </button>
    </form>

    <p class="auth-card__switch">
      Already have an account? <a routerLink="/login" [queryParams]="{returnUrl: returnUrl}">Sign in</a>
    </p>
  </div>
</div>
