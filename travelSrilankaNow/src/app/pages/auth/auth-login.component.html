<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <h2>{{ siteName }}</h2>
    </div>
    <h3 class="auth-card__title">Welcome Back</h3>
    <p class="auth-card__subtitle">Sign in to manage your bookings</p>

    <div class="auth-error-toast" *ngIf="error">
      <span class="auth-error-toast__icon">⚠</span>
      <span class="auth-error-toast__msg">{{ error }}</span>
      <button class="auth-error-toast__close" type="button" (click)="error = ''">✕</button>
    </div>

    <form (ngSubmit)="login()" class="auth-form">
      <div class="auth-form__group">
        <label>Username</label>
        <input type="text" [(ngModel)]="username" name="username" placeholder="Your username" autocomplete="username">
      </div>
      <div class="auth-form__group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Your password" autocomplete="current-password">
      </div>
      <p class="auth-card__switch" style="text-align: right; margin: -0.5rem 0 1rem;">
        <a routerLink="/forgot-password">Forgot password?</a>
      </p>
      <button type="submit" class="auth-btn" [disabled]="loading">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading" class="auth-btn__spinner"></span>
      </button>
    </form>

    <p class="auth-card__switch">
      Don't have an account? <a routerLink="/register" [queryParams]="{returnUrl: returnUrl}">Create one</a>
    </p>
  </div>
</div>
