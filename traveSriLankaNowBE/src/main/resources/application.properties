spring.application.name=traveSriLankaNowBE

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travel_srilanka_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=TravelSriLankaHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Batch-load lazy @OneToMany/@ElementCollection children (dates, pricings,
# locations, images, etc.) in groups instead of one query per parent row per
# collection - without this, listing/searching N packages/events with their
# nested collections is N-times-collection-count separate round trips.
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Initialization - disabled to prevent data.sql from running every time
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# JWT Configuration (values MUST be set via environment variables)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# MinIO Configuration
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:eventinvite}
minio.secret-key=${MINIO_SECRET_KEY:EventInvite2024!}
minio.bucket-name=${MINIO_BUCKET:travel-sri-lanka}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}

# Admin Default User (values MUST be set via environment variables)
admin.default.username=${ADMIN_USERNAME}
admin.default.password=${ADMIN_PASSWORD}
admin.default.email=${ADMIN_EMAIL:admin@travelsrilankanow.com}

# File Upload Configuration
spring.servlet.multipart.max-file-size=210MB
spring.servlet.multipart.max-request-size=210MB

# Allow numeric fields to be sent as strings from frontend
spring.jackson.mapper.allow-coercion-of-scalars=true

# Brevo Email Configuration
brevo.api-key=${BREVO_API_KEY:}
brevo.default-from-name=Travel Sri Lanka Now
brevo.default-from-email=noreply@travelsrilankanow.lk
