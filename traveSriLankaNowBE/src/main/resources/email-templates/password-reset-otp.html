<!doctype html>
<html>
<body style="margin:0;padding:0;background:#F8FAFC;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#F8FAFC;padding:32px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background:#FFFFFF;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background:#0F2854;padding:28px 32px;">
              <h1 style="margin:0;color:#FFFFFF;font-size:20px;">Password Reset Code</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#2A2826;">
              <p style="margin:0 0 16px;">Hi{{#firstName}} {{firstName}}{{/firstName}},</p>
              <p style="margin:0 0 24px;">Use the code below to reset your password. This code expires in {{expiryMinutes}} minutes.</p>
              <div style="text-align:center;margin:24px 0;">
                <span style="display:inline-block;font-size:32px;letter-spacing:8px;font-weight:bold;color:#0F2854;background:#F8FAFC;padding:16px 24px;border-radius:8px;">{{otp}}</span>
              </div>
              <p style="margin:16px 0 0;color:#6B6762;font-size:14px;">If you didn't request this, you can safely ignore this email — your password will not be changed.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
