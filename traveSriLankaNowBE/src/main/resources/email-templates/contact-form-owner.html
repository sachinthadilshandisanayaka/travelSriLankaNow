<!doctype html>
<html>
<body style="margin:0;padding:0;background:#F8FAFC;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#F8FAFC;padding:32px 0;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#FFFFFF;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background:#1C4D8D;padding:28px 32px;">
              <h1 style="margin:0;color:#FFFFFF;font-size:20px;">New Contact Form Message</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#2A2826;">
              <p style="margin:0 0 16px;">Someone just submitted the Contact Us form on the website:</p>
              <table width="100%" cellpadding="8" cellspacing="0" style="background:#F8FAFC;border-radius:8px;margin:16px 0;">
                <tr><td style="color:#6B6762;">Name</td><td style="text-align:right;font-weight:bold;">{{name}}</td></tr>
                <tr><td style="color:#6B6762;">Phone</td><td style="text-align:right;">{{phone}}</td></tr>
                <tr><td style="color:#6B6762;">Email</td><td style="text-align:right;">{{email}}</td></tr>
              </table>
              <p style="margin:16px 0 8px;color:#6B6762;">Message:</p>
              <p style="margin:0;padding:16px;background:#F8FAFC;border-radius:8px;">{{message}}</p>
              <p style="margin:20px 0 0;color:#6B6762;font-size:14px;">Contact {{name}} directly using the phone number or email above to follow up.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
