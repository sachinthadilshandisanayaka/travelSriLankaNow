server {
    listen 80;
    server_name ruklaktravels.com www.ruklaktravels.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ruklaktravels.com$request_uri;
    }
}

# www is not the canonical host - redirect it to the bare domain over HTTPS
# so Google indexes a single URL instead of two duplicate hosts.
server {
    listen 443 ssl;
    server_name www.ruklaktravels.com;

    ssl_certificate     /etc/letsencrypt/live/ruklaktravels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruklaktravels.com/privkey.pem;

    return 301 https://ruklaktravels.com$request_uri;
}

server {
    listen 443 ssl;
    server_name ruklaktravels.com;

    ssl_certificate     /etc/letsencrypt/live/ruklaktravels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruklaktravels.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 210M;

    # MinIO file storage — serves uploaded media over HTTPS
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 200M;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never cache index.html — ensures browsers pick up new chunk hashes after deploy
    location = /index.html {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
